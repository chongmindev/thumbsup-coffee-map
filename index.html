<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Thumbs Up Coffee Map</title>

  <!-- Font: Inter (clean, widely used on modern blogs) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --espresso: #3b2a20;
      --crema: #c8a27c;
      --cream: #f7f1ea;
      --ink: #221a14;
      --card: #ffffff;
      --ig1: #feda75;
      --ig2: #fa7e1e;
      --ig3: #d62976;
      --ig4: #962fbf;
      --ig5: #4f5bd5;
    }

    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--cream);
    }

    #map {
      position: absolute;
      inset: 0;
      background: var(--cream);
    }

    /* ---- Custom coffee pin ---- */
    .coffee-pin {
      /* leaflet sets width/height via iconSize; we center visuals ourselves */
    }
    .pin-wrap {
      position: relative;
      width: 50px;
      height: 50px;
      transition: transform 140ms ease;
      cursor: pointer;
      filter: drop-shadow(0 6px 10px rgba(59, 42, 32, 0.30));
    }
    .pin-wrap:hover { transform: translateY(-4px) scale(1.06); z-index: 1000; }

    .pin-ring {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      padding: 2.5px;
      background: conic-gradient(from 210deg, var(--ig1), var(--ig2), var(--ig3), var(--ig4), var(--ig5), var(--ig1));
      box-sizing: border-box;
    }
    .pin-face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--card) center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--espresso);
      border: 2.5px solid #fff;
      box-sizing: border-box;
    }
    .pin-face svg { width: 24px; height: 24px; }
    /* visit-count badge: solid accent circle on the top-right shoulder */
    .pin-count {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 9px;
      background: var(--espresso);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      border: 2px solid #fff;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* rating: white pill under the pin (the quality label) */
    .pin-rating {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translate(-50%, -9px);
      display: flex;
      align-items: center;
      gap: 3px;
      background: #fff;
      color: var(--espresso);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(59, 42, 32, 0.3);
    }
    .pin-rating svg { width: 11px; height: 11px; flex: none; }

    /* ---- Popup card ---- */
    .leaflet-popup-content-wrapper {
      border-radius: 16px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(34, 26, 20, 0.25);
    }
    .leaflet-popup-content { margin: 0; width: 280px !important; }
    .leaflet-popup-tip { box-shadow: 0 12px 30px rgba(34, 26, 20, 0.15); }
    /* close button: white × on a dark circle so it's visible over photos */
    .leaflet-popup-close-button {
      top: 8px !important;
      right: 8px !important;
      width: 26px !important;
      height: 26px !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
      padding: 0 !important;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45) !important;
      color: #fff !important;
      font-size: 20px !important;
      font-weight: 700;
      line-height: 1 !important;
    }
    .leaflet-popup-close-button:hover {
      background: rgba(0, 0, 0, 0.65) !important;
      color: #fff !important;
    }

    /* Square, to match an Instagram post. */
    .card-photo {
      aspect-ratio: 1 / 1;
      background: var(--cream) center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cdbcaa;
      border-bottom: 1px solid #efe6db;
    }
    .card-photo svg { width: 44px; height: 44px; }
    /* photo carousel */
    .card-photo-wrap { position: relative; }
    .ph-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 30px; height: 30px;
      border: none; border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      color: var(--espresso);
      font-size: 18px; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .ph-arrow:hover { background: #fff; }
    .ph-prev { left: 8px; }
    .ph-next { right: 8px; }
    .ph-dots {
      position: absolute;
      left: 0; right: 0; bottom: 8px;
      display: flex; justify-content: center; gap: 5px;
    }
    .ph-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.3);
    }
    .ph-dot.on { background: #fff; }
    .ph-count {
      position: absolute;
      right: 8px; bottom: 8px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 11px; font-weight: 700;
      padding: 2px 7px; border-radius: 999px;
    }
    /* visit pager (multiple posts at one location) */
    .visit-nav {
      display: flex; align-items: center; justify-content: center;
      gap: 12px;
      margin: 0 0 12px;
    }
    .vn-arrow {
      width: 24px; height: 24px;
      border: 1px solid #e6dccf; border-radius: 50%;
      background: #fff; color: var(--espresso);
      font-size: 15px; line-height: 1; cursor: pointer;
      font-family: inherit;
      display: flex; align-items: center; justify-content: center;
    }
    .vn-arrow:hover { background: var(--cream); }
    .vn-arrow:disabled { background: #ece3d6; color: #c4b4a1; border-color: #e0d5c6; cursor: default; }
    .vn-arrow:disabled:hover { background: #ece3d6; }
    /* fixed-width side slots keep the date centered even with one arrow */
    .vn-side { width: 24px; flex: none; display: flex; justify-content: center; }
    .vn-label { font-size: 12px; font-weight: 700; color: var(--espresso); }
    .card-body {
      padding: 11px 18px 16px;
      text-align: center;
    }
    /* Consistent 12px rhythm between the stacked sections. */
    .card-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--espresso);
      margin: 0 0 3px;
    }
    .card-meta {
      font-size: var(--meta-size, 12px);
      color: #8a7a6c;
      line-height: 1.35;
      margin: 0 0 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* rating: whole "4.5 / 5.0" centered as one block */
    .card-rating {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 4px;
      font-size: 14px;
      font-weight: 700;
      color: var(--espresso);
      margin: 0 0 12px;
    }
    .cr-max { color: #b0a294; font-weight: 600; }
    .card-drink-row { text-align: center; margin: 0 0 12px; }
    .card-drink {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--espresso);
      background: var(--cream);
      border-radius: 999px;
      padding: 5px 12px;
    }
    .card-note {
      font-size: 12.5px;
      color: #5c4f45;
      line-height: 1.5;
      margin: 0 0 12px;
      text-align: center;
    }
    .card-note.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0;
    }
    .note-wrap { margin: 0 0 12px; }
    .more-btn {
      background: none;
      border: none;
      padding: 4px 0 0;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: var(--espresso);
      cursor: pointer;
    }
    /* visit tabs (one per review, newest first) */
    .card-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 0 0 12px;
    }
    .card-tab {
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid #e6dccf;
      background: #fff;
      color: #8a7a6c;
      cursor: pointer;
    }
    .card-tab.active {
      background: var(--espresso);
      color: #fff;
      border-color: var(--espresso);
    }
    .ig-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 10px 0;
      border-radius: 10px;
      text-decoration: none;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2px;
      background: linear-gradient(95deg, #f58529, #dd2a7b 45%, #8134af 78%, #515bd4);
      box-shadow: 0 4px 12px rgba(221, 42, 123, 0.30);
      box-sizing: border-box;
    }
    .ig-btn:hover { filter: brightness(1.05); }
    .ig-btn:active { transform: translateY(1px); }
    .ig-btn svg { width: 16px; height: 16px; }
    /* Leaflet forces link color to blue inside the map; keep our button white. */
    .leaflet-popup-content a.ig-btn,
    .leaflet-popup-content a.ig-btn:visited { color: #fff; }

    /* ---- floating title chip ---- */
    .title-chip {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      border-radius: 999px;
      padding: 8px 14px 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(34, 26, 20, 0.18);
      font-weight: 700;
      color: var(--espresso);
      font-size: 14px;
    }
    .title-chip .dot {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--espresso);
      display: flex; align-items: center; justify-content: center;
    }
    .title-chip .dot svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="title-chip"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z"/><path d="M17 9h1.4a2.6 2.6 0 0 1 0 5.2H17"/><path d="M7.5 2.5c0 1-.9 1.4-.9 2.4S7.5 6.5 7.5 6.5"/><path d="M11 2.5c0 1-.9 1.4-.9 2.4S11 6.5 11 6.5"/></svg></span> Thumbs Up Coffee</div>

  <script>
    // ===============================================================
    // CONFIG
    // ---------------------------------------------------------------
    // To make the map read from your Google Sheet:
    //   1. Make a sheet with these columns in row 1 (exact names):
    //        name | area | lat | lng | rating | note | ig | thumb
    //      (thumb = optional image URL; leave blank to show the cup icon)
    //   2. File > Share > Publish to web > choose the sheet > "Comma-
    //      separated values (.csv)" > Publish. Copy the URL it gives.
    //   3. Paste that URL between the quotes below.
    // Until this is filled in, the map shows the SAMPLE data further down.
    // ===============================================================
    // When viewed locally (localhost / 127.0.0.1) read the local data-cafes.csv
    // so you can preview all pins + photos without waiting on a deploy. On the
    // live site it reads the Google Sheet.
    const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    const CONFIG = {
      sheetCsvUrl: LOCAL
        ? "data-cafes.csv"
        : "https://docs.google.com/spreadsheets/d/e/2PACX-1vSQW6l4tPHp5Fp9p8XGuXx1-PTiPY9qC73i8ftUIlcuLzdPKPC35XFxsLgx2eSqwctwlXtf9ilufB3a/pub?gid=445751395&single=true&output=csv",

      // MapTiler basemap key (free at maptiler.com → Account → Keys).
      // IMPORTANT: restrict the key to your domains in the MapTiler dashboard
      // (chongmindev.github.io + your Squarespace domain). Client-side keys are
      // public by design; the domain restriction is what protects it.
      // Until a key is set, the map falls back to OSM (not valid for production).
      maptilerKey: "MKqsKbKVDsfCae0TeC0m",
      maptilerStyle: "basic-v2" // warm, clean; also: dataviz-light, streets-v2, topo-v2
    };

    // ---------------------------------------------------------------
    // SAMPLE DATA (fallback). Once CONFIG.sheetCsvUrl is set, this is
    // ignored and the map reads your Google Sheet instead.
    //
    // Below is one REAL cafe you gave, geocoded from its address.
    // NOTE: this coordinate is STREET-LEVEL (압구정로34길), not the exact
    // storefront — the keyless lookup found the street but not building
    // #45. Pasting a Google Maps share link (or using the Kakao key)
    // would pin the exact door. Swap in the real IG post URL below.
    // ---------------------------------------------------------------
    const SAMPLE_CAFES = [
      { name: "Cafe Marie", area: "Apgujeong, Gangnam-gu",
        address: "45 Apgujeong-ro 34-gil, Gangnam-gu, Seoul",
        lat: 37.5263529, lng: 127.0306863, date: "2026-09-05",
        rating: "4.5", drink: "Cafe Latte Ristretto - Hot",
        note: "Warm, nutty, great mouthfeel and somehow tastes better because I know the guy behind the drink. It's as I remembered it from before my US trip. Awesome latte.",
        thumb: "images/cafe-marie-2026-09-05-1.jpg | images/cafe-marie-2026-09-05-2.jpg",
        ig: "https://www.instagram.com/p/Dc5imVFGaBg/" },
      { name: "Cafe Marie", area: "Apgujeong, Gangnam-gu",
        address: "45 Apgujeong-ro 34-gil, Gangnam-gu, Seoul",
        lat: 37.5263529, lng: 127.0306863, date: "2026-05-03",
        rating: "4.5", drink: "Cafe Latte Ristretto (Medium)",
        note: "Very toasty, sweet, and super clean with no bitter aftertaste. One of the best lattes I've had in a while. Really soothing on a rainy day. The owner is passionate about his craft and roasts his own blends daily.",
        thumb: "images/cafe-marie-2026-05-03-1.jpg | images/cafe-marie-2026-05-03-2.jpg | images/cafe-marie-2026-05-03-3.jpg | images/cafe-marie-2026-05-03-4.jpg | images/cafe-marie-2026-05-03-5.jpg | images/cafe-marie-2026-05-03-6.jpg | images/cafe-marie-2026-05-03-7.jpg",
        ig: "" }
    ];

    // ---- map ----
    // Zoom control on the right so it doesn't sit under the title chip.
    const map = L.map("map", { zoomControl: false, scrollWheelZoom: true })
      .setView([37.5263529, 127.0306863], 16);
    L.control.zoom({ position: "topright" }).addTo(map);

    // A user zoom (scroll or buttons) closes the open card. The programmatic
    // zoom we do when opening a card sets `autoPanning` so it doesn't self-close.
    let autoPanning = false;
    map.on("zoomstart", () => { if (!autoPanning) map.closePopup(); });

    // ---- basemap ----
    // MapTiler (free key, domain-restricted) is the one reliable option:
    // CARTO watermarks tiles, Esri light has no Seoul streets, and OSM.org
    // blocks embedded website use. Falls back to OSM only until a key is set.
    if (CONFIG.maptilerKey) {
      L.tileLayer(
        `https://api.maptiler.com/maps/${CONFIG.maptilerStyle}/{z}/{x}/{y}.png?key=${CONFIG.maptilerKey}`,
        {
          tileSize: 512,
          zoomOffset: -1,
          minZoom: 1,
          maxZoom: 20,
          crossOrigin: true,
          attribution:
            '&copy; <a href="https://www.maptiler.com/copyright/" target="_blank">MapTiler</a> ' +
            '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
        }
      ).addTo(map);
    } else {
      console.warn("No MapTiler key set — using OSM fallback (not valid for a production embed).");
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"
      }).addTo(map);
    }

    const igIcon =
      '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="white" stroke="none"/></svg>';

    // Inline line icons (no emoji).
    // Original coffee cup (bowl + handle + steam).
    const cupIcon =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z"/><path d="M17 9h1.4a2.6 2.6 0 0 1 0 5.2H17"/><path d="M7.5 2.5c0 1-.9 1.4-.9 2.4S7.5 6.5 7.5 6.5"/><path d="M11 2.5c0 1-.9 1.4-.9 2.4S11 6.5 11 6.5"/></svg>';
    // Same cup shifted right so the BOWL (ignoring the handle) sits centered.
    // Used on the map pin.
    const cupIconCentered =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(1.5 0)"><path d="M4 8h13v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z"/><path d="M17 9h1.4a2.6 2.6 0 0 1 0 5.2H17"/><path d="M7.5 2.5c0 1-.9 1.4-.9 2.4S7.5 6.5 7.5 6.5"/><path d="M11 2.5c0 1-.9 1.4-.9 2.4S11 6.5 11 6.5"/></g></svg>';
    const thumbIcon =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>';

    // Turn a photo value into a usable image URL. A normal Google Drive share
    // link (file must be shared "anyone with the link") is converted to Drive's
    // embeddable image URL; any other URL is used as-is.
    function imageUrl(raw) {
      raw = String(raw || "").trim();
      if (!raw) return "";
      if (raw.indexOf("drive.google.com") !== -1) {
        const m = raw.match(/\/d\/([^/]+)/) || raw.match(/[?&]id=([^&]+)/);
        if (m) return "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1200";
      }
      return raw;
    }

    // ---- group flat visit rows into cafes (one pin per cafe, many visits) ----
    function groupCafes(rows) {
      const byName = new Map();
      rows.forEach((r) => {
        const key = (r.name || "").trim().toLowerCase();
        if (!key) return;
        if (!byName.has(key)) byName.set(key, []);
        byName.get(key).push(r);
      });
      const cafes = [];
      byName.forEach((visits) => {
        visits.sort((a, b) => String(b.date || "").localeCompare(String(a.date || ""))); // newest first
        const loc = visits.find((v) => isFinite(v.lat) && isFinite(v.lng));
        cafes.push({
          name: visits[0].name,
          area: visits[0].area,
          address: visits[0].address,
          lat: loc ? loc.lat : NaN,
          lng: loc ? loc.lng : NaN,
          visits: visits
        });
      });
      return cafes;
    }

    // A visit's photos: `thumb` may hold several images separated by "|".
    function photosOf(v) {
      return String(v.thumb || "").split("|").map((s) => imageUrl(s)).filter(Boolean);
    }

    function makeIcon(cafe) {
      const top = cafe.visits[0];
      // Pins use a tiny thumbnail (images/thumb/...) so they load fast.
      const cover = photosOf(top)[0] || "";
      const img = cover.indexOf("images/") === 0 ? cover.replace("images/", "images/thumb/") : cover;
      const face = img
        ? `<div class="pin-face" style="background-image:url('${img}')"></div>`
        : `<div class="pin-face">${cupIconCentered}</div>`;
      const r = parseFloat(top.rating);
      const rv = Number.isInteger(r) ? String(r) : r.toFixed(1); // "5" not "5.0"
      // Rating = quality label UNDER the pin; count = accent badge on the shoulder.
      const rating = isFinite(r) ? `<div class="pin-rating">${thumbIcon}${rv}</div>` : "";
      const count = cafe.visits.length > 1
        ? `<div class="pin-count">${cafe.visits.length}</div>` : "";
      return L.divIcon({
        className: "coffee-pin",
        iconSize: [50, 50],
        iconAnchor: [25, 25], // center of the circle = the coordinate
        popupAnchor: [0, -28],
        html: `
          <div class="pin-wrap">
            <div class="pin-ring">${face}</div>
            ${count}${rating}
          </div>`
      });
    }

    // Registry so tab clicks can look the cafe up and re-render the card.
    const CAFES_BY_ID = {};
    let cafeSeq = 0;

    function fmtDate(d) {
      const p = String(d || "").split("-");
      if (p.length < 3) return d || "";
      const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][parseInt(p[1], 10) - 1] || "";
      return mon + " " + parseInt(p[2], 10) + ", " + p[0];
    }

    // Trim to street + area (drop country, county, and anything past the 2nd
    // part) so addresses stay short and readable on one line.
    function shortenAddr(s) {
      const parts = String(s || "").split(",").map((x) => x.trim())
        .filter((x) => x && !/^(south korea|united states|usa|u\.?s\.?a?\.?)$/i.test(x) && !/ county$/i.test(x));
      return parts.slice(0, 2).join(", ");
    }

    // Pick the largest single font size at which every address fits on one line.
    function fitMetaFont(cafes) {
      const texts = cafes.map((c) => shortenAddr(c.address || c.area || "")).filter(Boolean);
      if (!texts.length) return;
      const span = document.createElement("span");
      span.style.cssText = "position:absolute;left:-9999px;visibility:hidden;white-space:nowrap;" +
        "font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:400;";
      document.body.appendChild(span);
      const ref = 20, avail = 244 - 4; // card text width minus a little safety
      let size = 13; // upper cap
      texts.forEach((t) => {
        span.style.fontSize = ref + "px";
        span.textContent = t;
        const w = span.getBoundingClientRect().width;
        if (w > 0) size = Math.min(size, ref * avail / w);
      });
      document.body.removeChild(span);
      size = Math.max(11, Math.min(13, size)); // keep it readable
      document.documentElement.style.setProperty("--meta-size", size.toFixed(1) + "px");
    }

    // One visit's card content, for cafe.visits[i] showing photo p.
    function visitCard(cafe, i, p) {
      const v = cafe.visits[i];
      const cid = cafe._id;

      // --- photo carousel (multiple photos from the post) ---
      const photos = photosOf(v);
      const n = photos.length;
      p = n ? (((p || 0) % n) + n) % n : 0;
      const cur = n ? photos[p] : "";
      const photoInner = cur
        ? `<div class="card-photo" style="background-image:url('${cur}')"></div>`
        : `<div class="card-photo">${cupIcon}</div>`;
      const photoNav = n > 1 ? `
        <button class="ph-arrow ph-prev" onclick="event.stopPropagation();showPhoto('${cid}',${i},${p - 1})">‹</button>
        <button class="ph-arrow ph-next" onclick="event.stopPropagation();showPhoto('${cid}',${i},${p + 1})">›</button>
        <div class="ph-count">${p + 1}/${n}</div>` : "";
      const photo = `<div class="card-photo-wrap">${photoInner}${photoNav}</div>`;

      // --- visit pager (multiple posts at this location) ---
      // Newest first. Both arrows show for balance; the one with no post in that
      // direction is dimmed and not clickable. Right = older, left = newer.
      const last = cafe.visits.length - 1;
      const multi = cafe.visits.length > 1;
      const mkArrow = (glyph, target, enabled) =>
        `<button class="vn-arrow"${enabled ? ` onclick="event.stopPropagation();showVisit('${cid}',${target})"` : " disabled"}>${glyph}</button>`;
      const leftArrow = multi ? mkArrow("‹", i - 1, i > 0) : "";
      const rightArrow = multi ? mkArrow("›", i + 1, i < last) : "";
      // Always show the date (even for a single visit); arrows only when there
      // is a post in that direction.
      const visitNav = v.date
        ? `<div class="visit-nav"><span class="vn-side">${leftArrow}</span><span class="vn-label">${fmtDate(v.date)}</span><span class="vn-side">${rightArrow}</span></div>`
        : "";

      const meta = shortenAddr(cafe.address || cafe.area || "");
      const r = parseFloat(v.rating);
      const rating = isFinite(r)
        ? `<div class="card-rating">${r.toFixed(1)} <span class="cr-max">/ 5.0</span></div>` : "";
      // The "View on Instagram" button is always shown; if a visit has no post
      // link it falls back to the account.
      const igHref = v.ig || "https://www.instagram.com/thumbsup_coffee/";
      const igBtn = `<a class="ig-btn" href="${igHref}" target="_blank" rel="noopener">${igIcon} View on Instagram</a>`;

      // The drink shows as its own chip, so strip it from the note when it's
      // repeated at the start (avoids double-counting the coffee name).
      let note = (v.note || "").trim();
      const d = (v.drink || "").trim();
      if (d && note.toLowerCase().indexOf(d.toLowerCase()) === 0) {
        note = note.slice(d.length).replace(/^[\s\-–—:·,.]+/, "").trim();
      }
      // Always clamped with a hidden button; adjustNote() reveals the button
      // only if the text is actually cut off.
      const noteHtml = note
        ? `<div class="note-wrap"><p class="card-note clamped">${note}</p><button class="more-btn" onclick="event.stopPropagation();toggleNote(this)" hidden>Read more ▾</button></div>`
        : "";

      return `
        ${photo}
        <div class="card-body">
          <p class="card-name">${cafe.name}</p>
          ${meta ? `<p class="card-meta">${meta}</p>` : ""}
          ${visitNav}
          ${rating}
          ${v.drink ? `<div class="card-drink-row"><span class="card-drink">${v.drink}</span></div>` : ""}
          ${noteHtml}
          ${igBtn}
        </div>`;
    }

    window.showVisit = function (id, i) {
      const cafe = CAFES_BY_ID[id];
      const el = document.getElementById(id);
      if (!cafe || !el) return;
      i = Math.max(0, Math.min(cafe.visits.length - 1, i)); // clamp, no wrap
      el.innerHTML = visitCard(cafe, i, 0);
      adjustNote(el);
    };
    window.showPhoto = function (id, i, p) {
      const cafe = CAFES_BY_ID[id];
      const el = document.getElementById(id);
      if (cafe && el) { el.innerHTML = visitCard(cafe, i, p); adjustNote(el); }
    };
    window.toggleNote = function (btn) {
      const note = btn.parentElement.querySelector(".card-note");
      if (!note) return;
      const clamped = note.classList.toggle("clamped");
      btn.textContent = clamped ? "Read more ▾" : "Read less ▴";
    };
    // Show the "Show more" button only when the note is actually truncated.
    function adjustNote(root) {
      if (!root) return;
      const note = root.querySelector(".card-note");
      const btn = root.querySelector(".more-btn");
      if (!note) return;
      if (note.scrollHeight > note.clientHeight + 1) {
        if (btn) btn.hidden = false;
      } else {
        note.classList.remove("clamped");
        if (btn) btn.hidden = true;
      }
    }

    function popupHtml(cafe) {
      cafe._id = "cafe-" + (++cafeSeq);
      CAFES_BY_ID[cafe._id] = cafe;
      return `<div class="cafe-card" id="${cafe._id}">${visitCard(cafe, 0, 0)}</div>`;
    }

    // ---- render markers ----
    let markerLayer = L.layerGroup().addTo(map);
    function render(rows) {
      markerLayer.clearLayers();
      const cafes = groupCafes(rows);
      const bounds = [];
      cafes.forEach((cafe) => {
        if (!isFinite(cafe.lat) || !isFinite(cafe.lng)) return;
        const m = L.marker([cafe.lat, cafe.lng], { icon: makeIcon(cafe) });
        // We pan ourselves so the pin centers AND the whole popup stays on screen.
        m.bindPopup(popupHtml(cafe), { closeButton: true, maxWidth: 320, autoPan: false });
        m.on("popupopen", (e) => {
          adjustNote(document.getElementById(cafe._id));
          // Zoom in (if not already close) and center so the whole card shows.
          const targetZoom = Math.max(map.getZoom(), 17);
          const pt = map.project(m.getLatLng(), targetZoom);
          const popupH = (e.popup._container && e.popup._container.offsetHeight) || 280;
          pt.y -= popupH / 2;
          autoPanning = true; // our own zoom shouldn't close the card
          map.setView(map.unproject(pt, targetZoom), targetZoom, { animate: true });
          setTimeout(() => { autoPanning = false; }, 500);
        });
        markerLayer.addLayer(m);
        bounds.push([cafe.lat, cafe.lng]);
      });
      if (bounds.length === 1) map.setView(bounds[0], 16);
      else if (bounds.length) map.fitBounds(bounds, { padding: [60, 60] });
      // Size addresses to the largest uniform font that keeps them one-line.
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitMetaFont(cafes));
      else fitMetaFont(cafes);
    }

    // ---- tiny CSV parser (handles quoted fields, commas, newlines) ----
    function parseCsv(text) {
      const rows = [];
      let row = [], field = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else inQuotes = false;
          } else field += c;
        } else if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === "\r") { /* skip */ }
        else field += c;
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      return rows;
    }

    function csvToCafes(text) {
      const rows = parseCsv(text).filter((r) => r.some((c) => c.trim() !== ""));
      if (!rows.length) return [];
      const header = rows[0].map((h) => h.trim().toLowerCase());
      const idx = (k) => header.indexOf(k);
      const iName = idx("name"), iArea = idx("area"), iAddress = idx("address"),
        iLat = idx("lat"), iLng = idx("lng"), iRating = idx("rating"),
        iDrink = idx("drink"), iNote = idx("note"), iIg = idx("ig"),
        iThumb = idx("thumb"), iDate = idx("date");
      return rows.slice(1).map((r) => ({
        name: (r[iName] || "").trim(),
        area: (r[iArea] || "").trim(),
        address: iAddress >= 0 ? (r[iAddress] || "").trim() : "",
        lat: parseFloat(r[iLat]),
        lng: parseFloat(r[iLng]),
        rating: iRating >= 0 ? (r[iRating] || "").trim() : "",
        drink: iDrink >= 0 ? (r[iDrink] || "").trim() : "",
        note: (r[iNote] || "").trim(),
        ig: (r[iIg] || "").trim(),
        thumb: iThumb >= 0 ? (r[iThumb] || "").trim() : "",
        date: iDate >= 0 ? (r[iDate] || "").trim() : ""
      })).filter((c) => c.name);
    }

    // ---- load data: Google Sheet if configured, else sample ----
    if (CONFIG.sheetCsvUrl) {
      fetch(CONFIG.sheetCsvUrl)
        .then((res) => res.text())
        .then((text) => {
          // Rows are grouped into cafes by name; a cafe is placed if any of its
          // visits has coordinates. If nothing is located yet (e.g. the sheet
          // still has template rows), fall back to the sample.
          const rows = csvToCafes(text);
          const anyLocated = rows.some((r) => isFinite(r.lat) && isFinite(r.lng));
          render(anyLocated ? rows : SAMPLE_CAFES);
        })
        .catch((err) => {
          console.error("Sheet load failed, using sample data:", err);
          render(SAMPLE_CAFES);
        });
    } else {
      render(SAMPLE_CAFES);
    }
  </script>
</body>
</html>
